<svg width="480" height="320" viewBox="0 0 480 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Subtle minimalist product seal / emblem -->
  <defs>
    <filter id="softShadow" x="40" y="20" width="400" height="280" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#111111" flood-opacity="0.06"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <rect x="80" y="40" width="320" height="220" rx="2" fill="#FFFFFF"/>
    <rect x="80" y="40" width="320" height="220" rx="2" stroke="#EAEAE6" stroke-width="1"/>
  </g>
  <!-- Architectural legal emblem / geometric balance lines -->
  <line x1="120" y1="80" x2="360" y2="80" stroke="#111111" stroke-width="0.75" stroke-opacity="0.8"/>
  <text x="120" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" letter-spacing="3" fill="#111111" text-transform="uppercase" font-weight="400">Paisa Wapas</text>
  <text x="120" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9" letter-spacing="1.5" fill="#888888">DISPUTE RESOLUTION ENGINE</text>
  
  <line x1="120" y1="160" x2="280" y2="160" stroke="#EAEAE6" stroke-width="1"/>
  <line x1="120" y1="176" x2="240" y2="176" stroke="#EAEAE6" stroke-width="1"/>
  <line x1="120" y1="192" x2="320" y2="192" stroke="#EAEAE6" stroke-width="1"/>

  <!-- Minimalist seal / stamp mark -->
  <circle cx="340" cy="180" r="20" stroke="#111111" stroke-width="0.75" fill="none" stroke-opacity="0.6"/>
  <circle cx="340" cy="180" r="16" stroke="#EAEAE6" stroke-width="0.5" fill="none"/>
  <path d="M336 180H344M340 176V184" stroke="#111111" stroke-width="0.75"/>
</svg>
