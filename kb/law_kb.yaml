- id: NALSA-15100
  category: [consumer, deposit, salary]
  act: "Legal Services Authorities Act, 1987 (Section 12) — NALSA"
  section: "Section 12 (Pan-India Legal Aid Helpline 15100)"
  plain_summary: >
    The National Legal Services Authority (NALSA) operates the official 24x7 toll-free National Legal Aid Helpline: 15100 (accessible pan-India at nalsa.gov.in and nalsa15100.in).
    Under Section 12 of the Legal Services Authorities Act, 1987, free legal counsel, legal advice, and panel advocates are provided to eligible citizens (including women,
    industrial workmen, persons with disabilities, and citizens with annual income below state ceilings). The IVRS supports multiple regional languages and connects callers directly
    to their District Legal Services Authority (DLSA) or State Legal Services Authority (SLSA). Note: Delhi SLSA operates regional helpline 1516.
  applies_when: "User cannot afford a lawyer, needs free legal representation, or requires escalation to District Legal Services Authority"
  source_url: "https://nalsa.gov.in"
  verified: true
  last_checked: "2026-11-06"
  notes: "Verified official 24x7 Pan-India toll-free helpline is 15100. Regional Delhi SLSA helpline is 1516."

- id: LEGAL-NOTICE-HOWTO
  category: [consumer, deposit, salary]
  act: "N/A — practical guidance"
  section: "N/A"
  plain_summary: >
    A legal notice is a formal letter telling the other party what they owe and what you'll
    do if they don't pay. Key elements: your name and address, their name and address, facts
    of the dispute, the amount claimed, a deadline (usually 15 days), and the legal action
    you will take. Send by registered post/speed post AND email. Keep the postal receipt.
  applies_when: "Understanding what a legal notice is and how to send one"
  source_url: ""
  verified: true
  last_checked: "2026-11-06"
  notes: "Not mandatory before filing a case but strongly recommended"

